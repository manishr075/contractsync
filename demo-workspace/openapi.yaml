openapi: 3.0.3
info:
  title: Spot Service API
  version: 1.1.0
paths:
  /api/spots:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spot"
components:
  schemas:
    Spot:
      type: object
      required:
        - id
        - name
        - availability_state
      properties:
        id:
          type: integer
        name:
          type: string
        spot_status:
          type: string
          description: "DEPRECATED: Use availability_state instead. Retained for backward
            compatibility."
          deprecated: true
          example: available
        availability_state:
          type: string
          description: Current operational availability state of the resource spot
          example: available
        role:
          type: string
          description: Access role associated with the spot
          enum:
            - admin
            - user
            - guest
          example: admin
