openapi: 3.0.3
info:
  title: Spot Service API
  version: 1.1.0
  description: API for managing physical spaces and resource spots in the campus facility.
paths:
  /api/spots:
    get:
      summary: Retrieve spots
      description: Returns a list or single spot with status information.
      responses:
        "200":
          description: Successful spot lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Spot"
components:
  schemas:
    Spot:
      type: object
      required:
        - id
        - name
        - availability_state
      properties:
        id:
          type: integer
          description: Unique spot identifier
          example: 101
        name:
          type: string
          description: Name of the facility or spot
          example: Library
        spot_status:
          type: string
          description: "DEPRECATED: Use availability_state instead. Retained for backward
            compatibility."
          deprecated: true
          example: available
        availability_state:
          type: string
          description: Current operational availability state of the resource spot
          example: available
        role:
          type: string
          description: Access role associated with the spot
          enum:
            - admin
            - user
            - guest
          example: admin
